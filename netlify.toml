# Netlify Configuration for IPTS — MITCORER Internship Performance Tracking System
# This is a React SPA deployed to Netlify's CDN (frontend only).
# The Express backend (server.ts) runs separately — see DEPLOYMENT.md.

[build]
  command = "npm run build"
  publish = "dist"

# SPA Fallback: All routes (including React Router paths like /student, /admin)
# must return index.html so client-side routing works correctly.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
